name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Require the release tag to match the package version
        run: test "${GITHUB_REF_NAME}" = "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"

      - name: Install native Gmsh and CalculiX release oracles
        run: sudo apt-get update && sudo apt-get install -y gmsh calculix-ccx

      - name: Execute a native Gmsh mesh smoke test
        run: gmsh -3 tests/fixtures/bracket.step -format inp -o /tmp/mcp-calculix-release.inp && test -s /tmp/mcp-calculix-release.inp

      - name: Verify release gates
        run: deno task release:check

      - name: Execute native Gmsh and CalculiX release suite
        run: deno task test:native

  publish-jsr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # A push that does not bump the version must not turn the run red:
      # JSR versions are immutable, so "already published" is a no-op here,
      # not a failure.
      - name: Check whether this version is already on JSR
        id: version
        run: |
          NAME=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).name)')
          VER=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          BODY=$(curl -s "https://jsr.io/${NAME}/meta.json" || echo '{}')
          PUBLISHED=$(BODY="$BODY" VER="$VER" deno eval 'const m = JSON.parse(Deno.env.get("BODY") ?? "{}"); console.log((Deno.env.get("VER") ?? "") in (m.versions ?? {}))')
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "$NAME@$VER already on JSR: $PUBLISHED"

      - name: Publish to JSR
        if: steps.version.outputs.published != 'true'
        run: deno publish
