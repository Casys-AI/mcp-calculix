name: Publish

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x


      - name: Install gmsh + CalculiX (solve backend)
        run: sudo apt-get update && sudo apt-get install -y gmsh calculix-ccx

      - name: Verify server, viewer and native solve
        run: deno task release:check

  publish-jsr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        run: deno publish
