<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Result viewer</title>
    <style>
    :root {
  color-scheme: light dark;
  --surface: var(--color-background-primary, #101413);
  --panel: var(--color-background-secondary, #18201e);
  --text: var(--color-text-primary, #edf2ef);
  --muted: var(--color-text-secondary, #a6b3ac);
  --line: var(--color-border-primary, #405049);
  --accent: var(--color-accent, #8bc7a5);
  --danger: #df827b;
  --font-body: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  --font-data: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
}

* {
  box-sizing: border-box;
}
html,
body {
  min-width: 0;
  margin: 0;
  background: var(--surface);
  color: var(--text);
}
body {
  font: 14px/1.5 var(--font-body);
}
#root {
  max-width: 1040px;
  margin: 0 auto;
  padding: 16px;
}
.viewer {
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--panel);
}
.masthead {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: end;
  padding: 20px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 92%, var(--accent));
}
.kicker {
  margin: 0 0 4px;
  color: var(--accent);
  font: 700 11px/1.2 var(--font-data);
  letter-spacing: .12em;
}
h1,
h2,
p {
  margin-top: 0;
}
h1 {
  margin-bottom: 0;
  font-size: clamp(22px, 5vw, 32px);
  letter-spacing: -.03em;
}
.readout {
  color: var(--accent);
  border: 1px solid currentColor;
  padding: 4px 7px;
  font: 700 10px var(--font-data);
  letter-spacing: .09em;
}
.surface-root {
  min-width: 0;
  padding: 20px;
}
.mcp-view-component {
  min-width: 0;
  color: var(--text);
  font-family: var(--font-body);
}
.mcp-view-component strong,
.mcp-view-component dd {
  font-family: var(--font-data);
}
.mcp-view-component[data-primitive="metric-grid"] strong {
  color: var(--accent);
}
.state {
  min-height: 120px;
  display: grid;
  place-content: center;
  padding: 20px;
  text-align: center;
}
.error {
  color: var(--danger);
}
.spinner {
  width: 22px;
  height: 22px;
  margin: 0 auto 10px;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(1turn);
  }
}
@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}
@media (max-width: 680px) {
  #root {
    padding: 8px;
  }
  .masthead {
    display: block;
    padding: 14px;
  }
  .readout {
    display: inline-block;
    margin-top: 8px;
  }
  .surface-root {
    padding: 10px;
  }
  .mcp-view-surface-grid,
  .mcp-view-surface-row {
    grid-auto-flow: row !important;
    grid-template-columns: minmax(0, 1fr) !important;
  }
}
